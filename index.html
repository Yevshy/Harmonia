<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приватний Ліцей "Гармонія" — Хмельницький</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body class="bg-[#F8F7F4] text-gray-800">

  <!-- Sticky Header -->
  <header class="sticky top-0 bg-white/95 backdrop-blur-md border-b z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-blue-500 via-indigo-500 to-sky-400 flex items-center justify-center text-white text-3xl shadow-md">
          ☯
        </div>
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Приватний Ліцей "Гармонія"</h1>
          <p class="text-sm text-gray-500">Хмельницький</p>
        </div>
      </div>

      <nav class="hidden md:flex gap-8 text-sm font-medium">
        <a href="#" class="hover:text-blue-600 transition-colors">Про нас</a>
        <a href="#" class="hover:text-blue-600 transition-colors">Програми</a>
        <a href="#" class="hover:text-blue-600 transition-colors">Вступ</a>
        <a href="#" class="hover:text-blue-600 transition-colors">Новини</a>
        <a href="#" class="hover:text-blue-600 transition-colors">Контакти</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="min-h-screen flex items-center relative overflow-hidden">
    <div class="absolute inset-0 bg-[url('https://picsum.photos/id/1015/2000/1200')] bg-cover bg-center opacity-10"></div>
    <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center relative z-10">
      <div>
        <h1 class="text-5xl md:text-6xl font-semibold leading-tight mb-6">
          Хмельницький Приватний Ліцей "Гармонія"
        </h1>
        <p class="text-2xl text-gray-600 mb-10">
          "Гармонія" — це європейська освіта
        </p>
        <a href="#" class="inline-block bg-blue-600 text-white px-10 py-4 rounded-2xl text-lg font-medium hover:bg-blue-700 transition">
          Дізнатися більше
        </a>
      </div>
    </div>
  </section>

  <!-- Advantages -->
  <section class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-semibold text-center mb-12">Чому обирають нас</h2>
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- 4 tiles here - same as before but with blue accents -->
      </div>
    </div>
  </section>

  <!-- Наші вчителі -->
  <section class="py-20 bg-[#F8F7F4]">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-semibold text-center mb-12">Наші вчителі</h2>
      <!-- Тут будуть карточки вчителів з оригінального сайту -->
    </div>
  </section>

  <!-- Новини -->
  <section class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-4xl font-semibold text-center mb-12">Новини</h2>
      <!-- Новини з оригінального сайту -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 py-16">
    <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-10 text-sm">
      <!-- Footer content distributed nicely -->
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
